name: homemade_bliss
description: A micro-commerce bakery application.

publish_to: 'none'

environment:
  sdk: '>=2.17.0 <3.0.0'
  
dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^2.30.0
  firebase_auth: ^4.17.0
  cloud_firestore: ^4.0.0
  provider: ^6.0.0
  riverpod: ^2.0.0
  get: ^4.6.6
  firebase_storage: ^11.7.7
  image_picker: ^1.2.0
  flutter_stripe: ^12.0.2
  flutter_local_notifications: ^19.4.2
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

  assets:
    - assets/images/
