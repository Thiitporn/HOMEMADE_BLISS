name: Build Release

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Restore keystore from secret
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Missing KEYSTORE_BASE64 secret";
            exit 1;
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/myapp-release.keystore

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          # Pin to the project's local stable Flutter version (has Dart >= 3.6)
          flutter-version: '3.35.6'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        env:
          KEYSTORE_STORE_FILE: android/app/myapp-release.keystore
          KEYSTORE_STORE_PASSWORD: ${{ secrets.KEYSTORE_STORE_PASSWORD }}
          KEYSTORE_KEY_ALIAS: ${{ secrets.KEYSTORE_KEY_ALIAS }}
          KEYSTORE_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: build/app/outputs/flutter-apk/app-release.apk
